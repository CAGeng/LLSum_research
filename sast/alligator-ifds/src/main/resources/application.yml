    path: rules/core.xml
    pathSwitcher: off
    thirdPartyPath: rules/java-core.xml
    thirdPartyPathSwitcher: on
  added:
    path: rules/risky_funcs.xml
    pathSwitcher: on
    thirdPartyPath: rules/sources.xml
    thirdPartyPathSwitcher: off
  extend:
    path: rules/extend.xml
    pathSwitcher: off
    thirdPartyPath: rules/java-extend.xml
    thirdPartyPathSwitcher: on
  entry:
    path: rules/EntrySet_vul.xml
    switcher: on
  entrydetect:
    anno:
      path: entryrule/annotations.txt
    com:
      path: entryrule/communication.txt

  conditional: on
  taintFlag: on


analysis:
  taintSanitizeSwitcher: off
  simpleDataPathSwitcher: on
  onlyDataflowCallStackInter: off
  fieldSensitiveSwitcher: on
  sparkSwitcher: on
  conditionSummarySwitcher: on
  chainTrackMode: off

