spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: newuser
    password: newpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # 配置连接池大小，可以根据实际情况调整
      idle-timeout: 600000  # 连接池空闲连接最大存活时间
      max-lifetime: 1800000  # 连接池最大生命周期
      connection-timeout: 30000  # 获取连接的超时时间
  jpa:
    hibernate:
      ddl-auto: create  # 自动更新数据库结构，开发阶段可以使用 create/update，生产环境用 validate 或 none
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false  # 显示 SQL 语句，方便调试
    properties:
      hibernate:
        format_sql: true  # 格式化输出 SQL 语句
        jdbc:
          lob:
            non_contextual_creation: true  # 解决某些情况下对 LOB 类型的处理问题